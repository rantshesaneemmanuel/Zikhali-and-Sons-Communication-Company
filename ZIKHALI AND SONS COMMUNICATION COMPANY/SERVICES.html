<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Services | Zikhali and Sons</title>
    <link rel="stylesheet" href="style.css">

    <style>
        * {
            box-sizing: border-box;
        }

        .services-hero {
            min-height: 100vh;
            padding-bottom: 40px;

            background-image:
                linear-gradient(rgba(0,0,0,0.30), rgba(0,0,0,0.45)),
                url("imgs/background.jpg");

            background-size: cover;
            background-position: center;
            background-repeat: no-repeat;
        }

        .services-content {
            margin: 40px 30px;
            max-width: 1100px;
        }

        .services-heading-box h1 {
            font-size: 34px;
            color: #ff9d18;
        }

        .services-intro-box {
            background: rgba(86, 198, 235, 0.90);
            padding: 12px 20px;
            max-width: 650px;
            border-radius: 8px;
        }

        .services-intro-box p {
            color: #06274c;
            font-size: 17px;
            line-height: 1.6;
            margin: 0;
        }

        .service-list {
            display: grid;
            grid-template-columns: repeat(2, minmax(0, 1fr));
            gap: 20px;
            margin-top: 30px;
        }

        .service-box {
            min-height: 220px;
            display: flex;
            align-items: flex-end;
            padding: 20px;
            border-radius: 12px;
            border: 2px solid #ff9d18;
            text-decoration: none;
            background-size: cover;
            background-position: center;
            background-repeat: no-repeat;
            overflow: hidden;
            transition: transform 0.3s ease;
        }

        .service-box:hover {
            transform: scale(1.02);
        }

        .service-text {
            background: rgba(6, 39, 76, 0.80);
            padding: 10px 16px;
            border-radius: 6px;
            width: 100%;
        }

        .service-box h2 {
            color: #ff9d18;
            font-size: 22px;
            margin: 0;
        }

        /* Individual service backgrounds */

        .cloud-service {
            background-image:
                linear-gradient(rgba(0,0,0,0.20), rgba(0,0,0,0.35)),
                url("imgs/image 2.jpeg");
        }

       .internet-service {
    background-image:
        linear-gradient(rgba(0,0,0,0.20), rgba(0,0,0,0.35)),
        url("imgs/what_is_Internet 1.jpeg");

    background-size: cover;
    background-position: center;
    background-repeat: no-repeat;
}

        .digital-service {
            background-image:
                linear-gradient(rgba(0,0,0,0.20), rgba(0,0,0,0.35)),
                url("imgs/images (4).jpeg");
        }

        .video-service {
            background-image:
                linear-gradient(rgba(0,0,0,0.20), rgba(0,0,0,0.35)),
                url("imgs/image 6.jpeg");
        }

        @media (max-width: 650px) {
            .services-content {
                margin: 30px 15px;
            }

            .service-list {
                grid-template-columns: 1fr;
            }

            .service-box {
                min-height: 190px;
            }
        }

    </style>
</head>

<body>

<main class="services-hero">

    <header class="topbar">

        <a class="brand" href="index.html">
            <img class="brand-logo" src="imgs/logo.png" alt="Zikhali and Sons logo">
        </a>

        <nav class="navigation" aria-label="Main navigation">
            <a href="index.html">HOME</a>
            <a href="about us.html">ABOUT US</a>
            <a href="services.html">SERVICES</a>
            <a href="projects.html">PROJECTS</a>
            <a href="contacts.html">CONTACTS</a>
        </nav>

    </header>

    <section class="services-content">

        <div class="services-heading-box">

            <h1>OUR SERVICES</h1>

            <div class="services-intro-box">
                <p>
                    We provide reliable and creative communication
                    solutions to help individuals, businesses and
                    organisations connect with their audiences.
                </p>
            </div>

        </div>

        <div class="service-list">

            <!-- Cloud Services -->
            <a href="cloud services.html"
               class="service-box cloud-service">

                <div class="service-text">
                    <h2>Cloud Services</h2>
                </div>

            </a>

            <!-- Internet Services -->
            <a href="internet services.html"
               class="service-box internet-service">

                <div class="service-text">
                    <h2>Internet Services</h2>
                </div>

            </a>

            <!-- Digital Media Services -->
            <a href="https://www.canva.com/"
               class="service-box digital-service"
               target="_blank"
               rel="noopener noreferrer">

                <div class="service-text">
                    <h2>Digital Media Services</h2>
                </div>

            </a>

            <!-- Video and Audio Production -->
            <a href="video and audio productions.html"
               class="service-box video-service">

                <div class="service-text">
                    <h2>Video and Audio Production Services</h2>
                </div>

            </a>

        </div>

    </section>

</main>

</body>
</html>
